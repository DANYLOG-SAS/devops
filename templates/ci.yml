# CI — checks sur chaque Pull Request (ne pousse PAS d'image).
# À copier dans le projet : .github/workflows/ci.yml
#
# Toute la logique vit dans le repo devops ; ce fichier ne fait que l'appeler.
name: CI

# Se déclenche à CHAQUE modification : tout push sur une branche de travail et
# toute Pull Request. `main` est exclu car staging.yml y rejoue déjà la CI avant
# de déployer (évite de tout lancer deux fois).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  ci:
    uses: danylog-sas/devops/.github/workflows/reusable-ci.yml@v1
    with:
      seed-command: npm run seed
      test-commands: |
        npm run test:e2e
        npm run test:deep
        npm run test:preprod
