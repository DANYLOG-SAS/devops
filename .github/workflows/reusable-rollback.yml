# reusable-rollback.yml — rollback réutilisable sur VPS via SSH (workflow_call).
#
# Redéploie un tag choisi (ou le tag n-1 par défaut) déjà présent sur GHCR.
# Le caller expose généralement ce workflow via workflow_dispatch (déclenchement
# manuel) pour un rollback maîtrisé en un clic.

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        type: string
        required: true
      image-tag:
        description: Tag à redéployer. Vide = repasse au tag n-1 (.previous_tag).
        type: string
        default: ""
      compose-file:
        type: string
        default: docker-compose.prod.yml
      deploy-path:
        type: string
        required: true
      devops-ref:
        type: string
        default: v1
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      SSH_PORT:
        required: false
      GHCR_TOKEN:
        required: true
      ENV_PROD:
        required: false
      ENV_STAGING:
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout du projet (compose)
        uses: actions/checkout@v4

      - name: Checkout de la logique devops (scripts)
        uses: actions/checkout@v4
        with:
          repository: danylog-sas/devops
          ref: ${{ inputs.devops-ref }}
          path: _devops

      - name: Préparer le payload
        env:
          ENV_CONTENT: ${{ inputs.environment == 'production' && secrets.ENV_PROD || secrets.ENV_STAGING }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::Secret .env manquant pour l'environnement '${{ inputs.environment }}'" >&2
            exit 1
          fi
          mkdir -p payload/scripts
          cp _devops/scripts/*.sh payload/scripts/
          cp "${{ inputs.compose-file }}" "payload/${{ inputs.compose-file }}"
          printf '%s\n' "$ENV_CONTENT" > payload/.env

      - name: Copier le payload sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: payload
          target: ${{ inputs.deploy-path }}
          strip_components: 1
          overwrite: true

      - name: Rollback (login GHCR + rollback.sh)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,COMPOSE_FILE,DEPLOY_PATH,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            chmod +x scripts/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash scripts/rollback.sh "$IMAGE_TAG" "$COMPOSE_FILE"
            docker logout ghcr.io || true
