# reusable-ci.yml — chaîne d'intégration réutilisable (workflow_call).
#
# Ce que ce workflow GARANTIT avant qu'une image n'atteigne un serveur, en
# STAGES distincts (un job = un stage, lisible et relançable séparément) :
#
#   backend  : lint + LES MIGRATIONS PASSENT DEPUIS ZÉRO sur une base Postgres
#              jetable (c'est exactement la régression qui a cassé la prod
#              danschool : migrations non embarquées / incompatibles) + l'API
#              démarre et répond sur /health.
#   tests    : seed + API démarrée + suites automatisées (e2e…). Un échec ici
#              bloque la construction des images, donc le déploiement.
#   frontend : le frontend se build.
#   images   : (si push-images) build + smoke-test de l'IMAGE réelle — la
#              re-migration dans le conteneur attrape « dossier migrations/
#              absent de l'image » — puis push sur GHCR (version + sha + latest).
#
# DEUX RUNTIMES DE SERVEUR, ET UN SEUL PAR DÉFAUT
# ------------------------------------------------
# `backend-runtime` vaut "node" par défaut : sans cet input, TOUT se comporte
# exactement comme avant, à l'étape près. Le chemin "python" n'est fait que de
# steps supplémentaires gardés par un `if:` — aucune étape existante ne change
# de sens.
#
# C'est le cloisonnement qui compte ici : cette chaîne déploie danschool en
# production, et un projet qui arrive ne doit pas pouvoir en déranger un autre.
#
# Tout est paramétré ; les valeurs par défaut correspondent à danschool.

on:
  workflow_call:
    inputs:
      backend-runtime:
        description: >-
          Runtime du serveur : "node" (défaut, comportement historique) ou
          "python". Ne change QUE les étapes d'installation des jobs backend
          et tests ; le frontend reste Node dans les deux cas.
        type: string
        default: node
      node-version:
        type: string
        default: "20"
      python-version:
        description: Employée seulement si backend-runtime vaut "python".
        type: string
        default: "3.13"
      backend-install-command:
        description: >-
          Installation des dépendances du serveur, en Python UNIQUEMENT.
          Vide = `pip install -r requirements.txt`. Le chemin Node garde
          `npm ci` en dur : ne pas le rendre configurable, c'est garantir
          qu'aucun projet ne peut changer ce que fait la CI d'un autre.
        type: string
        default: ""
      backend-path:
        type: string
        default: backend
      frontend-path:
        type: string
        default: frontend
      frontend-paths:
        description: >-
          Plusieurs interfaces à construire, une par ligne (ex. "web" puis
          "web-admin"). Vide = `frontend-path` seul, comportement historique.
        type: string
        default: ""
      run-lint:
        type: boolean
        default: true
      lint-command:
        type: string
        default: npm run lint
      run-backend:
        description: Lancer le job backend (lint + migrations + boot/health)
        type: boolean
        default: true
      run-migrations:
        type: boolean
        default: true
      migrate-command:
        type: string
        default: npm run migrate
      node-env:
        description: >-
          NODE_ENV du job de tests. "test" par défaut : en "production" une API
          masque en général ses jetons de dev et durcit le rate-limit, ce qui
          rend les suites e2e inexécutables. Le smoke-test de l'image, lui,
          reste TOUJOURS en "production" pour valider la vraie config de prod.
        type: string
        default: test
      seed-command:
        description: >-
          Commande de seed jouée après les migrations (données exigées par les
          tests, ex. compte super_admin). Vide = pas de seed.
        type: string
        default: ""
      test-commands:
        description: >-
          Tests automatisés joués API DÉMARRÉE, une commande par ligne
          (ex. "npm run test:e2e"). Un échec bloque le déploiement.
        type: string
        default: ""
      start-command:
        type: string
        default: npm start
      health-path:
        type: string
        default: /api/v1/health
      health-port:
        type: number
        default: 3000
      build-frontend:
        type: boolean
        default: true
      frontend-build-command:
        type: string
        default: npm run build
      postgres-image:
        type: string
        default: postgres:15-alpine
      app-env:
        description: >-
          Variables applicatives supplémentaires pour la CI (multi-lignes KEY=VALUE) —
          secrets factices de test : JWT_SECRET, REFRESH_SECRET, etc.
        type: string
        default: ""
      push-images:
        type: boolean
        default: false
      push-api:
        description: Construire/pousser l'image API (désactiver pour un profil "static")
        type: boolean
        default: true
      push-web:
        description: Construire/pousser l'image WEB (désactiver pour un profil "service")
        type: boolean
        default: true
      image-tag:
        description: Tag de version des images (ex. v1.2.3). Vide = seulement sha + latest.
        type: string
        default: ""
      registry:
        type: string
        default: ghcr.io
      api-context:
        type: string
        default: backend
      api-dockerfile:
        type: string
        default: backend/Dockerfile
      web-context:
        type: string
        default: frontend
      web-dockerfile:
        type: string
        default: frontend/Dockerfile

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend : lint + migrations sur base jetable + boot/health
  # ---------------------------------------------------------------------------
  backend:
    if: ${{ inputs.run-backend }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # ── Runtime du serveur. Un seul des deux blocs s'exécute ; sans
      #    `backend-runtime`, c'est le bloc Node, à l'identique d'avant.
      - name: Setup Node ${{ inputs.node-version }}
        if: ${{ inputs.backend-runtime != 'python' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.backend-path }}/package-lock.json

      - name: Installer les dépendances (npm ci)
        if: ${{ inputs.backend-runtime != 'python' }}
        working-directory: ${{ inputs.backend-path }}
        # Littéral, et non une expression avec repli : `${{ x || 'npm ci' }}`
        # rend bien « npm ci » quand x est vide, mais ce serait tout de même
        # une expression de plus sur le chemin de danschool. Ici la commande
        # Node est celle d'hier, mot pour mot.
        run: npm ci

      - name: Setup Python ${{ inputs.python-version }}
        if: ${{ inputs.backend-runtime == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Installer les dépendances (pip)
        if: ${{ inputs.backend-runtime == 'python' }}
        working-directory: ${{ inputs.backend-path }}
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.backend-install-command || 'pip install -r requirements.txt' }}

      - name: Préparer l'environnement de CI
        if: ${{ inputs.backend-runtime != 'python' }}
        env:
          APP_ENV: ${{ inputs.app-env }}
        run: |
          {
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_NAME=ci_test"
            echo "DB_USER=ci"
            echo "DB_PASSWORD=ci"
            echo "DB_SYNC=false"
            echo "REDIS_URL=redis://localhost:6379"
            echo "NODE_ENV=${{ inputs.node-env }}"
            echo "PORT=${{ inputs.health-port }}"
            # Valeurs FACTICES mais VALIDES (longues et distinctes) : elles
            # satisfont aussi les contrôles de sécurité stricts d'une appli qui
            # démarrerait en production. Surchargeables via l'input `app-env`.
            echo "JWT_SECRET=ci-dummy-jwt-secret-never-used-in-production-0001"
            echo "REFRESH_SECRET=ci-dummy-refresh-secret-never-used-in-prod-0002"
            echo "CORS_ORIGIN=https://ci.invalid"
            echo "APP_URL=https://ci.invalid"
            printf '%s\n' "$APP_ENV"
          } >> "$GITHUB_ENV"

      - name: Préparer l'environnement de CI (Python)
        if: ${{ inputs.backend-runtime == 'python' }}
        env:
          APP_ENV: ${{ inputs.app-env }}
        run: |
          # Les COORDONNÉES de la base jetable, et rien d'autre. Ni NODE_ENV
          # ni JWT_SECRET : ce sont les noms de danschool, et les poser chez
          # un projet Python ne ferait qu'encombrer son environnement de
          # variables qu'il n'attend pas.
          #
          # Tout ce qui est propre au projet passe par `app-env` — c'est là
          # qu'un projet Python déclare son METREX_BASE, son DATABASE_URL ou
          # ce qu'il nomme ainsi.
          {
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_NAME=ci_test"
            echo "DB_USER=ci"
            echo "DB_PASSWORD=ci"
            echo "REDIS_URL=redis://localhost:6379"
            echo "PORT=${{ inputs.health-port }}"
            printf '%s\n' "$APP_ENV"
          } >> "$GITHUB_ENV"

      - name: Lint
        if: ${{ inputs.run-lint }}
        working-directory: ${{ inputs.backend-path }}
        run: ${{ inputs.lint-command }}

      - name: Valider les migrations sur une base VIERGE
        if: ${{ inputs.run-migrations }}
        working-directory: ${{ inputs.backend-path }}
        run: ${{ inputs.migrate-command }}

      # L'API est lancée en arrière-plan et LAISSÉE EN VIE : les tests des étapes
      # suivantes tapent dessus. Elle est arrêtée par l'étape finale (always()).
      - name: Démarrer l'API et vérifier /health
        working-directory: ${{ inputs.backend-path }}
        run: |
          nohup ${{ inputs.start-command }} > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          echo "API démarrée (PID=$(cat /tmp/api.pid))"
          url="http://localhost:${{ inputs.health-port }}${{ inputs.health-path }}"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)"
            case "$code" in
              200|400|401) echo "API up — HTTP $code"; exit 0 ;;
            esac
            echo "attente API... (HTTP $code) [$i/30]"; sleep 3
          done
          echo "::error::L'API n'a pas démarré ou /health ne répond pas" >&2
          exit 1

      # Les logs de l'API expliquent la plupart des échecs de boot ou de tests.
      - name: Logs de l'API
        if: ${{ always() }}
        run: |
          echo "── /tmp/api.log ──"
          tail -n 200 /tmp/api.log 2>/dev/null || echo "(aucun log)"
          [ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          exit 0

  # ---------------------------------------------------------------------------
  # 2. Tests automatisés (stage distinct) : seed + API démarrée + suites
  # ---------------------------------------------------------------------------
  tests:
    # Étape distincte du build : lint/migrations/boot sont déjà validés par `backend`.
    needs: backend
    if: ${{ inputs.run-backend && inputs.test-commands != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # ── Runtime du serveur. Un seul des deux blocs s'exécute ; sans
      #    `backend-runtime`, c'est le bloc Node, à l'identique d'avant.
      - name: Setup Node ${{ inputs.node-version }}
        if: ${{ inputs.backend-runtime != 'python' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.backend-path }}/package-lock.json

      - name: Installer les dépendances (npm ci)
        if: ${{ inputs.backend-runtime != 'python' }}
        working-directory: ${{ inputs.backend-path }}
        # Littéral, et non une expression avec repli : `${{ x || 'npm ci' }}`
        # rend bien « npm ci » quand x est vide, mais ce serait tout de même
        # une expression de plus sur le chemin de danschool. Ici la commande
        # Node est celle d'hier, mot pour mot.
        run: npm ci

      - name: Setup Python ${{ inputs.python-version }}
        if: ${{ inputs.backend-runtime == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Installer les dépendances (pip)
        if: ${{ inputs.backend-runtime == 'python' }}
        working-directory: ${{ inputs.backend-path }}
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.backend-install-command || 'pip install -r requirements.txt' }}

      - name: Préparer l'environnement de CI
        if: ${{ inputs.backend-runtime != 'python' }}
        env:
          APP_ENV: ${{ inputs.app-env }}
        run: |
          {
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_NAME=ci_test"
            echo "DB_USER=ci"
            echo "DB_PASSWORD=ci"
            echo "DB_SYNC=false"
            echo "REDIS_URL=redis://localhost:6379"
            echo "NODE_ENV=${{ inputs.node-env }}"
            echo "PORT=${{ inputs.health-port }}"
            # Valeurs FACTICES mais VALIDES (longues et distinctes) : elles
            # satisfont aussi les contrôles de sécurité stricts d'une appli qui
            # démarrerait en production. Surchargeables via l'input `app-env`.
            echo "JWT_SECRET=ci-dummy-jwt-secret-never-used-in-production-0001"
            echo "REFRESH_SECRET=ci-dummy-refresh-secret-never-used-in-prod-0002"
            echo "CORS_ORIGIN=https://ci.invalid"
            echo "APP_URL=https://ci.invalid"
            printf '%s\n' "$APP_ENV"
          } >> "$GITHUB_ENV"

      - name: Préparer l'environnement de CI (Python)
        if: ${{ inputs.backend-runtime == 'python' }}
        env:
          APP_ENV: ${{ inputs.app-env }}
        run: |
          # Les COORDONNÉES de la base jetable, et rien d'autre. Ni NODE_ENV
          # ni JWT_SECRET : ce sont les noms de danschool, et les poser chez
          # un projet Python ne ferait qu'encombrer son environnement de
          # variables qu'il n'attend pas.
          #
          # Tout ce qui est propre au projet passe par `app-env` — c'est là
          # qu'un projet Python déclare son METREX_BASE, son DATABASE_URL ou
          # ce qu'il nomme ainsi.
          {
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_NAME=ci_test"
            echo "DB_USER=ci"
            echo "DB_PASSWORD=ci"
            echo "REDIS_URL=redis://localhost:6379"
            echo "PORT=${{ inputs.health-port }}"
            printf '%s\n' "$APP_ENV"
          } >> "$GITHUB_ENV"

      - name: Valider les migrations sur une base VIERGE
        if: ${{ inputs.run-migrations }}
        working-directory: ${{ inputs.backend-path }}
        run: ${{ inputs.migrate-command }}

      - name: Seed des données de test
        if: ${{ inputs.seed-command != '' }}
        working-directory: ${{ inputs.backend-path }}
        run: ${{ inputs.seed-command }}

      # L'API est lancée en arrière-plan et LAISSÉE EN VIE : les tests des étapes
      # suivantes tapent dessus. Elle est arrêtée par l'étape finale (always()).
      - name: Démarrer l'API et vérifier /health
        working-directory: ${{ inputs.backend-path }}
        run: |
          nohup ${{ inputs.start-command }} > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          echo "API démarrée (PID=$(cat /tmp/api.pid))"
          url="http://localhost:${{ inputs.health-port }}${{ inputs.health-path }}"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)"
            case "$code" in
              200|400|401) echo "API up — HTTP $code"; exit 0 ;;
            esac
            echo "attente API... (HTTP $code) [$i/30]"; sleep 3
          done
          echo "::error::L'API n'a pas démarré ou /health ne répond pas" >&2
          exit 1

      - name: Tests automatisés
        if: ${{ inputs.test-commands != '' }}
        working-directory: ${{ inputs.backend-path }}
        env:
          TEST_COMMANDS: ${{ inputs.test-commands }}
        run: |
          mapfile -t CMDS <<< "$TEST_COMMANDS"
          for cmd in "${CMDS[@]}"; do
            [ -z "${cmd//[[:space:]]/}" ] && continue
            echo "───────────────────────────────────────────"
            echo "▶ $cmd"
            echo "───────────────────────────────────────────"
            # Sortie NON repliée : en cas d'échec, le détail doit être lisible
            # directement dans le log, sans avoir à déplier un groupe.
            if ! eval "$cmd"; then
              echo "::error::Tests en échec : $cmd (voir la sortie ci-dessus)" >&2
              exit 1
            fi
          done

      # Les logs de l'API expliquent la plupart des échecs de boot ou de tests.
      - name: Logs de l'API
        if: ${{ always() }}
        run: |
          echo "── /tmp/api.log ──"
          tail -n 200 /tmp/api.log 2>/dev/null || echo "(aucun log)"
          [ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          exit 0

  # ---------------------------------------------------------------------------
  # 3. Frontend : build
  # ---------------------------------------------------------------------------
  frontend:
    if: ${{ inputs.build-frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ══ UNE SEULE INTERFACE — LE CHEMIN HISTORIQUE, INTACT ══════════════
      #
      # Ces trois étapes sont celles d'avant, au caractère près. Un projet qui
      # ne déclare pas `frontend-paths` emprunte exactement le même chemin
      # qu'hier : aucune de ses exécutions ne passe par le code ajouté
      # au-dessous.
      #
      # C'est plus verbeux qu'une boucle qui tournerait une fois, et c'est
      # voulu : cette chaîne déploie de la production, et un projet qui arrive
      # ne doit pas pouvoir en déranger un autre. Le jour où tous les projets
      # emploieront `frontend-paths`, ce bloc disparaîtra.
      - name: Setup Node ${{ inputs.node-version }}
        if: ${{ inputs.frontend-paths == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend-path }}/package-lock.json
      - name: Installer les dépendances (npm ci)
        if: ${{ inputs.frontend-paths == '' }}
        working-directory: ${{ inputs.frontend-path }}
        run: npm ci
      - name: Build frontend
        if: ${{ inputs.frontend-paths == '' }}
        working-directory: ${{ inputs.frontend-path }}
        run: ${{ inputs.frontend-build-command }}

      # ══ PLUSIEURS INTERFACES ════════════════════════════════════════════
      #
      # Une boucle plutôt qu'une matrice : une matrice se construit depuis du
      # JSON, ce qu'un input multi-lignes n'est pas — il aurait fallu un job
      # de préparation dans CHAQUE exécution, y compris celles qui n'ont
      # qu'une interface.
      - name: Lister les interfaces
        id: liste
        if: ${{ inputs.frontend-paths != '' }}
        env:
          PLUSIEURS: ${{ inputs.frontend-paths }}
        run: |
          chemins="$(echo "$PLUSIEURS" | sed '/^[[:space:]]*$/d')"
          {
            echo "chemins<<FIN"
            echo "$chemins"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"
          echo "à construire :"; echo "$chemins" | sed 's/^/  · /'

      - name: Setup Node ${{ inputs.node-version }}
        if: ${{ inputs.frontend-paths != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # Accepte plusieurs lignes : le cache couvre toutes les interfaces.
          cache-dependency-path: |
            ${{ steps.liste.outputs.chemins }}/package-lock.json

      - name: Installer et construire chaque interface
        if: ${{ inputs.frontend-paths != '' }}
        env:
          CHEMINS: ${{ steps.liste.outputs.chemins }}
          COMMANDE: ${{ inputs.frontend-build-command }}
        run: |
          # `set -e` ne suffit pas dans un `while` alimenté par un tube : le
          # corps tourne dans un sous-shell, et un échec y passerait inaperçu.
          # On teste donc le code de retour à la main.
          echo "$CHEMINS" | while IFS= read -r chemin; do
            [ -n "$chemin" ] || continue
            echo "── $chemin"
            ( cd "$chemin" && npm ci && eval "$COMMANDE" ) || exit 1
          done

  # ---------------------------------------------------------------------------
  # 4. Images : build + smoke-test de l'image réelle + push GHCR
  # ---------------------------------------------------------------------------
  images:
    needs: [backend, tests, frontend]
    # Ne construit/pousse que si demandé, et seulement si les jobs amont n'ont pas
    # échoué (un job volontairement désactivé = skipped, ce qui n'est pas un échec).
    if: ${{ inputs.push-images && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # Requis pour builder avec buildx (driver docker-container) : sans lui,
      # le driver docker par défaut ne gère ni le cache distant ni certaines
      # options de build.
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les noms d'images Docker doivent être en MINUSCULES ; `github.repository`
      # conserve la casse de l'org (ex. DANYLOG-SAS/danschool) -> on la normalise.
      - name: Normaliser le nom d'image
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Métadonnées image API
        id: meta_api
        if: ${{ inputs.push-api }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ steps.img.outputs.repo }}-api
          tags: |
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=sha
            type=raw,value=latest,enable=${{ inputs.image-tag != '' }}

      - name: Métadonnées image WEB
        id: meta_web
        if: ${{ inputs.push-web }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ steps.img.outputs.repo }}-web
          tags: |
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=sha
            type=raw,value=latest,enable=${{ inputs.image-tag != '' }}

      - name: Build image API (chargée localement pour test)
        if: ${{ inputs.push-api }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.api-context }}
          file: ${{ inputs.api-dockerfile }}
          load: true
          tags: ci-local/api:test

      - name: SMOKE TEST — migrations embarquées + boot dans l'image réelle
        if: ${{ inputs.push-api }}
        env:
          APP_ENV: ${{ inputs.app-env }}
        run: |
          {
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_NAME=ci_test"
            echo "DB_USER=ci"
            echo "DB_PASSWORD=ci"
            echo "DB_SYNC=false"
            echo "REDIS_URL=redis://localhost:6379"
            echo "NODE_ENV=production"
            echo "PORT=${{ inputs.health-port }}"
            # Valeurs FACTICES mais VALIDES : on teste le chemin de démarrage
            # "production", qui refuse à raison les secrets courts/identiques ou
            # un CORS en localhost. Surchargeables via l'input `app-env`.
            echo "JWT_SECRET=ci-dummy-jwt-secret-never-used-in-production-0001"
            echo "REFRESH_SECRET=ci-dummy-refresh-secret-never-used-in-prod-0002"
            echo "CORS_ORIGIN=https://ci.invalid"
            echo "APP_URL=https://ci.invalid"
            printf '%s\n' "$APP_ENV"
          } > ci-app.env
          docker run -d --name api_smoke --network host --env-file ci-app.env ci-local/api:test
          url="http://localhost:${{ inputs.health-port }}${{ inputs.health-path }}"
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)"
            case "$code" in 200|400|401) ok=1; break ;; esac
            echo "attente image API... (HTTP $code) [$i/30]"; sleep 3
          done
          echo "----- logs conteneur -----"; docker logs api_smoke || true
          docker rm -f api_smoke >/dev/null 2>&1 || true
          if [ "$ok" != 1 ]; then
            echo "::error::L'image API ne démarre pas (migrations non embarquées ?)" >&2
            exit 1
          fi
          echo "Image API OK — migrations embarquées et boot validés"

      - name: Pousser l'image API sur GHCR (multi-tags)
        if: ${{ inputs.push-api }}
        run: |
          echo "${{ steps.meta_api.outputs.tags }}" | while read -r t; do
            [ -z "$t" ] && continue
            docker tag ci-local/api:test "$t"
            docker push "$t"
            echo "poussé: $t"
          done

      - name: Build + push image WEB sur GHCR
        if: ${{ inputs.push-web }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.web-context }}
          file: ${{ inputs.web-dockerfile }}
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
