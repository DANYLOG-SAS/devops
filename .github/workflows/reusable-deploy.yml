# reusable-deploy.yml — déploiement réutilisable sur VPS via SSH (workflow_call).
#
# Principe : le VPS ne fait que `pull` une image DÉJÀ construite/testée sur GHCR.
# Ce workflow pousse la LOGIQUE (scripts/) + le compose + le .env (depuis un
# secret), puis lance scripts/deploy.sh sur le serveur. deploy.sh gère backup,
# migrations (au boot), healthcheck et rollback automatique.
#
# La logique reste CENTRALE : les scripts sont copiés depuis ce repo à chaque
# déploiement, donc un correctif ici profite immédiatement à tous les projets.

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        type: string
        required: true
      image-tag:
        description: Tag d'image GHCR à déployer (ex. v1.2.3 ou un sha)
        type: string
        required: true
      compose-file:
        type: string
        default: docker-compose.prod.yml
      deploy-path:
        description: Répertoire de déploiement sur le VPS (ex. /opt/danschool)
        type: string
        required: true
      devops-ref:
        description: Ref du repo devops d'où proviennent les scripts (ex. v1)
        type: string
        default: v1
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      SSH_PORT:
        required: false
      GHCR_TOKEN:
        required: true
      ENV_PROD:
        description: Contenu complet du .env de PRODUCTION
        required: false
      ENV_STAGING:
        description: Contenu complet du .env de STAGING
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout du projet (compose)
        uses: actions/checkout@v4

      - name: Checkout de la logique devops (scripts)
        uses: actions/checkout@v4
        with:
          repository: danylog-sas/devops
          ref: ${{ inputs.devops-ref }}
          path: _devops

      - name: Préparer le payload de déploiement
        env:
          # Sélectionne le .env selon l'environnement (permet `secrets: inherit`).
          ENV_CONTENT: ${{ inputs.environment == 'production' && secrets.ENV_PROD || secrets.ENV_STAGING }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::Secret .env manquant pour l'environnement '${{ inputs.environment }}' (ENV_PROD/ENV_STAGING)" >&2
            exit 1
          fi
          mkdir -p payload/scripts
          cp _devops/scripts/*.sh payload/scripts/
          cp "${{ inputs.compose-file }}" "payload/${{ inputs.compose-file }}"
          printf '%s\n' "$ENV_CONTENT" > payload/.env
          echo "Payload prêt :"; find payload -type f | sort

      - name: Copier le payload sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: payload
          target: ${{ inputs.deploy-path }}
          strip_components: 1
          overwrite: true

      - name: Déployer (login GHCR + deploy.sh)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,COMPOSE_FILE,DEPLOY_PATH,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            chmod +x scripts/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash scripts/deploy.sh "$IMAGE_TAG" "$COMPOSE_FILE"
            docker logout ghcr.io || true
