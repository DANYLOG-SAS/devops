name: setup-app
description: >-
  Configure Node.js avec cache npm et installe les dépendances (npm ci).
  Composite réutilisable — à appeler après actions/checkout.
  Usage: uses: danylog243/devops/actions/setup-app@v1

inputs:
  node-version:
    description: Version de Node.js
    required: false
    default: "20"
  working-directory:
    description: Dossier contenant package.json / package-lock.json
    required: false
    default: "."
  install:
    description: Lancer `npm ci` après le setup (true/false)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Installer les dépendances (npm ci)
      if: ${{ inputs.install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
